name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          MODEL_PROVIDER: fake
          SEARCH_PROVIDER: fake

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deployment images are the release artefacts: build them on every push so a
      # Dockerfile regression cannot reach the server.
      - run: docker build -f apps/api/Dockerfile -t homeops-api:ci .
      - run: docker build -f apps/web/Dockerfile -t homeops-web:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs against the deterministic fake providers: no API keys needed.
      - run: pnpm test:e2e
