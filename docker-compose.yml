# Local parity with production: the web app is public, the API stays internal.
# Real keys come from .env (docker compose reads it automatically).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8787"
      DB_PATH: /data/homeops.db
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1/}
      NEBIUS_MODEL_PLAN: ${NEBIUS_MODEL_PLAN:-nvidia/Nemotron-3_5-Lightning}
      NEBIUS_MODEL_FAST: ${NEBIUS_MODEL_FAST:-nvidia/Nemotron-3_5-Lightning}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-local-token}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - homeops-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server-side proxy target: the API container, never the public internet.
      INTERNAL_API_URL: http://api:8787
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  homeops-data:

